name: Cocode TUI npm release

on:
  workflow_dispatch:
  push:
    tags:
      - "tui-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-host-supervisor:
    name: Publish Host Supervisor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cocode-host-supervisor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: cocode-host-supervisor/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test and build
        run: pnpm test && pnpm run typecheck && pnpm run build

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks

  publish-tui:
    name: Publish TUI
    runs-on: ubuntu-latest
    needs: publish-host-supervisor
    defaults:
      run:
        working-directory: cocode-tui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: cocode-tui/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/tui-v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "tui-v$VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          }

      - name: Install dependencies after Supervisor publish
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build and validate release package
        run: pnpm run release:check

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks
