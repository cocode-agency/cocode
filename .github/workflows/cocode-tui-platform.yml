name: Cocode TUI platform checks

on:
  push:
    paths:
      - "cocode-tui/**"
      - ".github/workflows/cocode-tui-platform.yml"
  pull_request:
    paths:
      - "cocode-tui/**"
      - ".github/workflows/cocode-tui-platform.yml"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        working-directory: cocode-tui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: |
            cocode-host-supervisor/pnpm-lock.yaml
            cocode-tui/pnpm-lock.yaml

      - name: Install Host supervisor dependencies
        working-directory: cocode-host-supervisor
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Host supervisor
        working-directory: cocode-host-supervisor
        run: pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and validate release package
        run: pnpm run release:check

      - name: Run tests
        run: pnpm test

      - name: Typecheck TUI source
        run: pnpm exec tsc --noEmit --project tsconfig.json

      - name: Typecheck connection package
        run: pnpm exec tsc --noEmit --project packages/connection/tsconfig.json

      - name: Lint TUI source
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check
