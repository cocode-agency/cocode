name: Cocode GUI Linux branch draft

on:
  push:
    branches:
      - os/linux

concurrency:
  group: cocode-gui-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Linux DEB + RPM / ${{ matrix.arch }}
    environment: Linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: cocode-gui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: |
            cocode-gui/pnpm-lock.yaml
            cocode-tui/pnpm-lock.yaml
            cocode-host-supervisor/pnpm-lock.yaml
      - name: Assert native Linux runner
        run: node scripts/release/assert-native-release-host.mjs --platform linux --arch "${{ matrix.arch }}"
      - name: Install Linux packaging dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth binutils dpkg-dev rpm gnupg
      - name: Import Linux package signing key
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          test -n "$LINUX_GPG_PRIVATE_KEY"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Install Host Supervisor dependencies
        working-directory: cocode-host-supervisor
        run: corepack pnpm@10.34.5 install --frozen-lockfile --ignore-scripts
      - name: Install TUI dependencies
        working-directory: cocode-tui
        run: corepack pnpm@10.34.5 install --frozen-lockfile --ignore-scripts
      - name: Install GUI dependencies
        run: corepack pnpm@10.34.5 install --frozen-lockfile
      - name: Check build environment
        run: corepack pnpm@10.34.5 run check:env
      - name: Build signed Linux packages
        env:
          RELEASE_PLATFORM: linux
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_REQUIRE_SIGNING: "1"
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: corepack pnpm@10.34.5 run release:linux:${{ matrix.arch }}
      - name: Verify Linux package structure, signatures and release metadata
        env:
          RELEASE_REQUIRE_SIGNING: "1"
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            corepack pnpm@10.34.5 run verify:linux:arm64 -- --skip-smoke
          else
            corepack pnpm@10.34.5 run verify:linux-packages -- --arch "${{ matrix.arch }}"
          fi
      - name: Upload Linux branch artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocode-linux-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            cocode-gui/release/linux/${{ matrix.arch }}/*.deb
            cocode-gui/release/linux/${{ matrix.arch }}/*.rpm
            cocode-gui/release/linux/${{ matrix.arch }}/*.asc
            cocode-gui/release/linux/${{ matrix.arch }}/latest-linux*.yml
            cocode-gui/release/linux/${{ matrix.arch }}/SHA256SUMS-${{ matrix.arch }}
            cocode-gui/release/linux/${{ matrix.arch }}/linux-release-manifest-${{ matrix.arch }}.json

  smoke-deb:
    name: Installed DEB smoke / ${{ matrix.arch }}
    needs: [build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cocode-linux-${{ matrix.arch }}-${{ github.sha }}
          path: release-assets/${{ matrix.arch }}
      - name: Install Debian runtime smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth
          command -v xvfb-run
      - name: Install DEB and smoke-test as an ordinary user
        env:
          SMOKE_USER: runner
          ELECTRON_AUTO_UPDATE: "off"
          SMOKE_PRESERVE_ARTIFACTS: "1"
          SMOKE_ARTIFACT_ROOT: ${{ runner.temp }}/cocode-deb-smoke
        run: |
          deb="$(find "release-assets/${{ matrix.arch }}" -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          bash cocode-gui/scripts/release/verify-installed-linux-package.sh deb "$deb"
      - name: Upload DEB smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocode-linux-deb-smoke-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/cocode-deb-smoke/**

  smoke-rpm:
    name: Installed RPM smoke / ${{ matrix.arch }}
    needs: [build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            docker_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cocode-linux-${{ matrix.arch }}-${{ github.sha }}
          path: release-assets/${{ matrix.arch }}
      - name: Install RPM in Fedora and smoke-test as an ordinary user
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          rpm="$(find "release-assets/${{ matrix.arch }}" -type f -name '*.rpm' -print -quit)"
          test -n "$rpm"
          package_path="/workspace/${rpm#./}"
          docker_log="$(mktemp "${RUNNER_TEMP:-/tmp}/cocode-rpm-smoke.log.XXXXXX")"
          if docker run --rm \
              --platform "linux/$DOCKER_ARCH" \
              --security-opt seccomp=unconfined \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              --env PACKAGE_FILE="$package_path" \
              --env ELECTRON_AUTO_UPDATE=off \
              --env SMOKE_PRESERVE_ARTIFACTS=1 \
              --env SMOKE_ARTIFACT_ROOT="/workspace/.tmp/cocode-rpm-smoke/${{ matrix.arch }}" \
              fedora:42 \
              bash -euc '
                rpm_prerequisites_log="/tmp/cocode-rpm-prerequisites.log"
                if ! dnf -y --setopt=install_weak_deps=False install \
                  xorg-x11-server-Xvfb \
                  xorg-x11-xauth \
                  shadow-utils \
                  >"$rpm_prerequisites_log" 2>&1; then
                  tail -n 200 "$rpm_prerequisites_log" >&2 || true
                  exit 1
                fi
                SMOKE_USER=cocode-smoke bash cocode-gui/scripts/release/verify-installed-linux-package.sh rpm "$PACKAGE_FILE"
              ' \
              >"$docker_log" 2>&1; then
            rm -f "$docker_log"
          else
            docker_status=$?
            tail -n 200 "$docker_log" >&2 || true
            rm -f "$docker_log"
            exit "$docker_status"
          fi
      - name: Upload RPM smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocode-linux-rpm-smoke-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: ignore
          path: .tmp/cocode-rpm-smoke/${{ matrix.arch }}/**
      - name: Clean RPM smoke workspace
        if: always()
        run: rm -rf ".tmp/cocode-rpm-smoke/${{ matrix.arch }}"

  draft-release:
    name: Update os/linux draft release
    needs: [build, smoke-deb, smoke-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: os-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cocode-linux-x64-${{ github.sha }}
          path: release-assets/x64
      - uses: actions/download-artifact@v4
        with:
          name: cocode-linux-arm64-${{ github.sha }}
          path: release-assets/arm64
      - name: Recheck downloaded release evidence
        run: |
          for arch in x64 arm64; do
            (
              cd "release-assets/$arch"
              sha256sum -c "SHA256SUMS-$arch"
            )
          done
      - name: Create or keep draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --draft=true \
              --target "$GITHUB_SHA" \
              --title "Cocode Linux (os/linux)"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Cocode Linux (os/linux)" \
              --notes "Automated Linux packages from the os/linux branch."
          fi
      - name: Upload current Linux packages and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/x64/* \
            release-assets/arm64/* \
            --clobber
      - name: Remove stale draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_assets="$(find release-assets -type f -printf '%f\n' | sort -u)"
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            if ! grep -Fqx "$asset" <<<"$expected_assets"; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
      - name: Verify draft release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          expected_assets="$(find release-assets -type f -printf '%f\n' | sort -u)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | sort -u)"
          diff -u \
            <(printf '%s\n' "$expected_assets") \
            <(printf '%s\n' "$actual_assets")
